# ==============================================================================
# Worker da Galeria Anima -> https://wsengenhariadigital.com.br/anima/
#
# Arquitetura (regra atual do projeto, sobrescreve a antiga "so proxy/DNS"):
#
#   * O bundle estatico (server/public) e servido por ESTA Worker em /anima/*.
#   * /anima/api/*, /anima/media/* e *.php sao enviados por PROXY para a
#     origem InfinityFree (185.27.134.95), que continua rodando PHP 8.2 +
#     MySQL. Sem esse proxy o login e as midias quebrariam.
#   * O backend PHP continua sendo publicado por FTPS, como sempre:
#     publicar.bat  OU  powershell -File tools\deploy.ps1 -Build
#
# Deploy do FRONTEND (este arquivo + worker.js + bundle):
#   Workers Builds do Cloudflare, conectado ao GitHub wandersilva5/anima-web,
#   branch main: build_command "cd app && npm ci && npm run build",
#   deploy_command "npx wrangler deploy".
# ==============================================================================

name = "anima-web"
main = "worker.js"
compatibility_date = "2026-11-17"

# Rotas criadas junto com cada deploy (zona wsengenhariadigital.com.br).
# A raiz do dominio NAO e interceptada: continua indo para a origem.
routes = [
  { pattern = "wsengenhariadigital.com.br/anima/*", zone_name = "wsengenhariadigital.com.br" },
  { pattern = "wsengenhariadigital.com.br/anima", zone_name = "wsengenhariadigital.com.br" }
]

[assets]
directory = "server/public"
# binding expoe env.ASSETS para o worker buscar o bundle
binding = "ASSETS"
# worker primeiro em todos os caminhos: e ela quem faz o proxy da API/media
# e o fallback da SPA. O lookup de assets e feito dentro de worker.js.
run_worker_first = true
